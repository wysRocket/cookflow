services:
  - type: web
    name: cookflow-auth
    runtime: node
    plan: free
    region: frankfurt  # closest to eurocookflow.com (EU)
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: node server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_URL
        sync: false   # set in Render dashboard after first deploy
      - key: BETTER_AUTH_SECRET
        sync: false   # set in Render dashboard
      - key: COOKFLOW_FRONTEND_URL
        value: https://eurocookflow.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
