name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_REQUIRE_AUTH: "true"
          VITE_AUTH_URL: "https://cookflow-auth.onrender.com"
          VITE_AUTH_PROXY_TARGET: "https://cookflow-auth.onrender.com"

      - name: Archive production build
        run: cd dist && zip -r ../dist.zip .
        
      - name: Deploy to Hostinger via API MCP
        run: node scripts/deploy.mjs
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: eurocookflow.com
          ARCHIVE_PATH: ./dist.zip
